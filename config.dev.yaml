server:
  client_id: "default"
  upstream: ["node", "examples/echo-server/server.js"]   # gateway mode: spawn the real MCP server as upstream

transport:
  client: sse          # MCP clients connect to MCP Arc over SSE
  listen: ":8081"
  upstream: stdio

audit:
  enabled: true
  driver: memory       # in-memory store: no CGO/sqlite needed, perfect for a local demo (data is lost on exit)
  dsn: ./mcp-arc-dev.db

masking:
  enabled: true
  rules:
    - name: email
      patterns:
        - '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
      mask_char: "***@***.com"
    - name: credit_card
      patterns:
        - '\b\d{4}[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}\b'
      mask_char: "****-****-****-****"
    - name: api_key
      patterns:
        - '\b(?:sk-|pk-|api[_-]?key|token)[-_A-Za-z0-9]{10,}\b'
      mask_char: "****"
    - name: id_card_cn
      patterns:
        - '\b\d{17}[\dXx]\b'
      mask_char: "*****************"
    - name: sensitive_fields
      fields: [password, passwd, pwd, secret, token, apiKey, api_key, cvv, card_cvv]
      mask_char: "****"

# LLM 辅助脱敏（可选，默认关闭）。开起来需要一个 OpenAI 兼容端点：
#   export MCP_ARC_LLM_API_KEY=sk-...
#   export MCP_ARC_LLM_ENDPOINT=https://api.openai.com/v1
llm:
  enabled: false
  model: "gpt-4o-mini"
  timeout_ms: 3000
  max_bytes: 8192
  apply_to_result: false

rate_limit:
  enabled: true
  qps: 10
  daily_quota: 10000

admin:
  enabled: true
  port: 8080
  token: "change-me"
  open_browser: true   # auto-open the web console in the default browser on startup
