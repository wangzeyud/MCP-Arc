name: release

# 在打 tag（v*）时自动构建跨平台二进制并附到 GitHub Release。
# 这样非开发者用户无需本地 Go / Node，直接下载对应平台的二进制即可使用。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build embedded web console
        # 二进制通过 //go:embed 打包 web/dist，必须先构建前端
        run: |
          cd web
          npm install
          npm run build

      - name: Build cross-platform binaries (CGO / SQLite via xgo)
        uses: crazy-max/ghaction-xgo@v3
        with:
          go_version: '1.22'
          dest: dist
          prefix: mcp-arc
          targets: linux/amd64,darwin/amd64,darwin/arm64,windows/amd64
          ldflags: -s -w

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
