server:
  client_id: "default"
  # gateway mode: spawn the real MCP server as upstream (requires Node.js).
  # Relative paths here resolve against THIS config file's directory, not the
  # CWD the MCP client spawned mcp-arc with — so keep this file next to the
  # binary and use relative paths without hardcoding absolute locations.
  upstream: ["node", "examples/echo-server/server.js"]
  # wait (ms) for the upstream's FIRST connection. An npx child may still be
  # downloading its package on a cold cache, which can exceed 10s. 0 => 30000.
  # Raise (e.g. 60000) for slow first-time package installs. After the first
  # connect the proxy fails fast again, so this only ever delays a cold start.
  upstream_connect_timeout_ms: 30000

transport:
  client: stdio          # local mode: the MCP client (Cherry Studio / Claude Desktop / Cursor) spawns MCP Arc as a stdio child
  listen: ":8081"        # only used by the HTTP client transports (sse / streamable-http)
  upstream: stdio        # MCP Arc talks to the upstream over stdio

audit:
  enabled: true
  # sqlite 用的是纯 Go 驱动（modernc.org/sqlite），CGO_ENABLED=0 也能加载，
  # 记录持久化、重启不丢。相对的 dsn 会锚定到本配置文件所在目录（不是启动进程的
  # CWD），所以多实例/被 MCP 客户端拉起时都不会把 db 落到奇怪的地方。
  # 想临时跑"零残留"可改成 memory —— 但进程一退出就清空，控制台会一直看起来是空的。
  driver: sqlite
  dsn: ./mcp-arc.db
  shutdown_flush_timeout_ms: 5000        # 优雅关闭时排干审计队列的最长时间
  # 审计保留（可选，默认关闭）。两项均 0 = 不裁剪。
  # retention:
  #   max_age_days: 90     # 删除 90 天前的记录
  #   max_rows: 1000000   # 仅保留最新 100 万条（启动裁剪 + 每小时周期清理）

masking:
  enabled: true
  rules:
    - name: email
      patterns:
        - '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}\b'
      mask_char: "***@***.com"
    - name: credit_card
      patterns:
        - '\b\d{4}[\s-]?\d{4}[\s-]?\d{4}[\s-]?\d{4}\b'
      mask_char: "****-****-****-****"
    - name: api_key
      patterns:
        - '\b(?:sk-|pk-|api[_-]?key|token)[-_A-Za-z0-9]{10,}\b'
      mask_char: "****"
    - name: id_card_cn
      patterns:
        - '\b\d{17}[\dXx]\b'
      mask_char: "*****************"
    - name: sensitive_fields
      fields: [password, passwd, pwd, secret, token, apiKey, api_key, cvv, card_cvv]
      mask_char: "****"
  # 预置脱敏模板（代码内建库，按名引用；不列则不启用）
  presets:
    - phone_cn
    - ip
    - bank_card_cn

# 可选：LLM 辅助脱敏（第二遍补漏）。静态规则先跑，模型只负责抓漏网之鱼。
# 失败 / 超时一律 fail-open：不影响 tool 调用，退回静态脱敏结果。
llm:
  enabled: false
  # OpenAI 兼容的 chat completions 地址；不以 /chat/completions 结尾时会自动补上
  endpoint: ""            # 例：https://api.openai.com/v1 或 https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key: ""             # 建议用环境变量 MCP_ARC_LLM_API_KEY，别写进配置文件
  model: "gpt-4o-mini"
  timeout_ms: 3000        # 单次 tool 调用愿意为模型等的最长时间
  max_bytes: 8192         # 超过这个体积的参数跳过 LLM
  cache_ttl_seconds: 300  # 相同入参的结果缓存时长
  cache_entries: 512
  apply_to_result: false  # 是否也对上游返回做 LLM 补漏（默认只对请求参数）

rate_limit:
  enabled: true    # 按 client_id 限流（令牌桶 QPS + 日配额）
  qps: 10
  daily_quota: 10000

admin:
  enabled: true
  port: 8080
  token: "change-me"
  open_browser: false  # do not pop a browser on every launch; open http://localhost:8080 yourself when you want the console
